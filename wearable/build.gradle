plugins {
    id 'com.android.application'
}

android {
    namespace 'ie.udaltsoft.musicwatch'
    compileSdk 35

    defaultConfig {
        applicationId "ie.udaltsoft.musicwatch"
        minSdk 35 // Required for WFF v2
        targetSdkVersion 35
        versionCode 31
        versionName '3.1'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // Pure WFF projects do not need any dependencies. 
    // They are fully declarative XML-based packages.
}

// Automatically generate the 18-layer watchface XML from the template before every build
tasks.register('generateWatchFace', Exec) {
    workingDir projectDir
    commandLine 'python3', '../tools/generate_watchface.py', '../tools/watchface.xml.template', 'src/main/res/raw/watchface.xml'
}

// Ensure the XML is regenerated whenever the template or script changes
preBuild.dependsOn generateWatchFace

// Clean up the generated watchface.xml when running the clean task
clean {
    delete 'src/main/res/raw/watchface.xml'
}

// Use the 'alias' syntax for cleaner dependency management, especially in newer Gradle versions
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ie.udaltsoft.musicwatch'
    compileSdk 34

    defaultConfig {
        applicationId "ie.udaltsoft.musicwatch"
        minSdk 33
        // UPDATED: Target SDK is now 34 for Android 14
        targetSdkVersion 34
        versionCode 24
        versionName '2.4'
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // It's recommended to use a proper release signing config instead of debug
            // signingConfig signingConfigs.release
        }
    }

    compileOptions {
        // UPDATED: Java 17 is standard for modern Android development
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        // UPDATED: Aligned Kotlin toolchain with Java 17
        jvmTarget = '17'
    }

    buildFeatures {
        // Required for newer AndroidX libraries that may use data binding or view binding
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.wear.watchface:watchface:1.2.1'
    implementation 'androidx.wear.watchface:watchface-complications-data:1.2.1'
    implementation 'androidx.wear.watchface:watchface-style:1.2.1'
    implementation 'androidx.wear.watchface:watchface-editor:1.2.1'

    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.gms:play-services-wearable:18.2.0'

    // KEPT: Your SVG library
    implementation 'com.caverock:androidsvg-aar:1.4'
}